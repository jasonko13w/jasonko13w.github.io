<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>王序名 Jason Wang｜作品集</title>
<meta name="description" content="王序名（Jason Wang）的作品集：觀察、理解，然後提出建議；從真實狀況做出實際工具。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ===== 顏色（想換顏色改這裡）===== */
  :root{
    --bg:#faf8f5; --card:#ffffff; --text:#2b2b2b; --muted:#6b6b6b; --line:#e6e1da;
    --accent:#e8663a; --accent-soft:#fdeee7; --accent-text:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161514; --card:#1f1e1c; --text:#f1efec; --muted:#a8a29b; --line:#33302c;
      --accent:#f07a50; --accent-soft:#3a2219; --accent-text:#ffffff;
    }
  }
  :root[data-theme="dark"]{
    --bg:#161514; --card:#1f1e1c; --text:#f1efec; --muted:#a8a29b; --line:#33302c;
    --accent:#f07a50; --accent-soft:#3a2219; --accent-text:#ffffff;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:"Noto Sans TC", -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background:var(--bg); color:var(--text); line-height:1.75;
  }
  .wrap{ max-width:880px; margin:0 auto; padding:0 20px; }
  /* 中文只在標點處換行 */
  p, li, h1{ word-break:keep-all; overflow-wrap:anywhere; text-wrap:pretty; }

  /* ===== 區塊一：名字、標語、副標 ===== */
  .hero{ padding:28px 0 64px; }
  .name{ font-size:15px; font-weight:500; color:var(--muted); letter-spacing:.05em; margin-bottom:72px; }
  .slogan{ font-size:clamp(28px, 5.4vw, 44px); font-weight:700; line-height:1.4; margin-bottom:14px; }
  .subtitle{ font-size:clamp(16px, 3.2vw, 19px); color:var(--muted); }

  .divider{ border:none; border-top:1px solid var(--line); }

  /* ===== 每一區：電腦版左邊小標題、右邊內容 ===== */
  .section{ display:grid; grid-template-columns:160px minmax(0,1fr); gap:24px; padding:48px 0; }
  .section-title{ font-size:14px; font-weight:500; color:var(--muted); letter-spacing:.1em; padding-top:4px; }

  /* 關於我 */
  .about p{ font-size:17px; color:var(--text); margin-bottom:14px; }
  .about p:last-of-type{ margin-bottom:0; }
  .about strong{ font-weight:700; }
  .tags{ display:flex; flex-wrap:wrap; gap:8px; margin-top:20px; }
  .tag{ font-size:13px; font-weight:500; color:var(--muted); border:1px solid var(--line); background:var(--card); border-radius:999px; padding:4px 12px; }

  /* 作品 */
  .card{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:28px; }
  .kicker{ display:inline-block; font-size:12px; font-weight:700; color:var(--accent); background:var(--accent-soft); border-radius:999px; padding:2px 10px; margin-bottom:10px; }
  .card-title{ font-size:24px; font-weight:700; line-height:1.3; margin-bottom:6px; }
  .card-desc{ color:var(--muted); margin-bottom:18px; }
  .btn{ display:inline-block; background:var(--accent); color:var(--accent-text); text-decoration:none; font-weight:500; padding:11px 26px; border-radius:999px; margin-bottom:22px; transition:filter .2s; }
  .btn:hover{ filter:brightness(1.07); }
  .btn:focus-visible{ outline:3px solid var(--accent); outline-offset:3px; }
  .points{ list-style:none; border-top:1px solid var(--line); padding-top:18px; }
  .points li{ position:relative; padding-left:18px; margin-bottom:10px; }
  .points li:last-child{ margin-bottom:0; }
  .points li::before{ content:""; position:absolute; left:0; top:.72em; width:7px; height:7px; border-radius:50%; background:var(--accent); }
  .more{ margin-top:14px; border:1px dashed var(--line); border-radius:18px; padding:16px 24px; color:var(--muted); font-size:15px; }

  /* 聯絡我 */
  .contact p{ margin-bottom:6px; font-size:16px; }
  .contact a{ color:var(--text); text-decoration:none; border-bottom:1px solid var(--line); }
  .contact a:hover{ border-bottom-color:var(--accent); }
  .label{ color:var(--muted); display:inline-block; min-width:4.2em; }

  footer{ padding:28px 0 48px; font-size:13px; color:var(--muted); }

  /* ===== 手機：改成上下排列 ===== */
  @media (max-width:640px){
    .hero{ padding:24px 0 48px; }
    .name{ margin-bottom:48px; }
    .section{ grid-template-columns:1fr; gap:14px; padding:36px 0; }
    .about p{ font-size:16px; }
    .card{ padding:22px 20px; }
    .card-title{ font-size:21px; }
  }
</style>
</head>
<body>
  <main class="wrap">

    <!-- 區塊一：名字、標語、副標 -->
    <header class="hero">
      <div class="name">王序名 Jason Wang</div>
      <h1 class="slogan">聆聽與觀察，理解後，一起做決定。</h1>
      <p class="subtitle">善用工具來解決現場遇到的問題</p>
    </header>

    <hr class="divider">

    <!-- 區塊三：作品 -->
    <section class="section">
      <h2 class="section-title">作品</h2>
      <div>
        <div class="card">
          <span class="kicker">餐飲 × 數據</span>
          <h3 class="card-title">餐飲AI助理</h3>
          <p class="card-desc">從報表到決策，老闆不用再煩惱。</p>
          <a class="btn" href="https://jasonwanit.com/flash-report/">開始使用 →</a>
          <ul class="points">
            <li>一次了解當月和歷年的營業額差別</li>
            <li>上傳菜單照片，系統自動填好品項和價格</li>
            <li>依照過去的季節銷量，找出下一季適合主打的商品</li>
          </ul>
        </div>
        <div class="more">更多作品陸續加入中。</div>
      </div>
    </section>

    <hr class="divider">

    <!-- 區塊四：聯絡我 -->
    <section class="section contact">
      <h2 class="section-title">聯絡我</h2>
      <div>
        <p><span class="label">Email</span><a href="mailto:jasonko13w@gmail.com">jasonko13w@gmail.com</a></p>
        <p><span class="label">手機</span><a href="tel:0918272658">0918-272-658</a></p>
      </div>
    </section>

    <hr class="divider">
    <footer>© 2026 Jason Wan IT</footer>
  </main>
</body>
</html>
